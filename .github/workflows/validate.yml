name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install -r tests/requirements.txt -r companion/requirements.txt
      - name: Run tests
        run: pytest tests -q --cov=companion --cov-report=xml:coverage.xml --junitxml=xunit-reports/xunit-result.xml
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            xunit-reports/xunit-result.xml
          retention-days: 7

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  sonarqube:
    name: SonarCloud
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo pull requests carry the GitHub event the scanner needs for
    # decoration. Fork pull requests cannot read SONAR_TOKEN.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: .
      - name: Require coverage and test reports
        run: test -f coverage.xml && test -f xunit-reports/xunit-result.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
