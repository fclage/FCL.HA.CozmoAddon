sonar.projectKey=fclage_FCL.HA.CozmoAddon
sonar.organization=fclage
sonar.projectName=FCL.HA.CozmoAddon
sonar.projectVersion=0.1.3
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# This file keeps SonarCloud Automatic Analysis off. CI runs the scan.

sonar.sources=custom_components,companion,custom_cards
sonar.tests=tests
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=xunit-reports/xunit-result.xml
# Pytest's report has no file path Sonar can attach to a test file.
sonar.python.xunit.skipDetails=true
sonar.exclusions=**/__pycache__/**,docs/**,**/.venv/**
# The integration is checked by hassfest. These paths have no coverage report.
sonar.coverage.exclusions=custom_components/**,companion/static/**,custom_cards/**
